name: MirriHost
options:
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  webrtc-xcframework:
    url: https://github.com/livekit/webrtc-xcframework.git
    version: 150.7871.02
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    version: 1.21.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    version: 5.0.0
  swift-asn1:
    url: https://github.com/apple/swift-asn1.git
    version: 1.7.3
targets:
  MirriHostCore:
    type: framework
    platform: macOS
    sources:
      - Core
    dependencies:
      - package: webrtc-xcframework
        product: LiveKitWebRTC
      - target: VirtualDisplayShim
        link: true
      - package: swift-certificates
        product: X509
      - package: swift-crypto
        product: Crypto
      - package: swift-asn1
        product: SwiftASN1
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/VirtualDisplayShim/include"
  VirtualDisplayShim:
    type: library.static
    platform: macOS
    sources:
      - VirtualDisplayShim
    settings:
      base:
        PUBLIC_HEADERS_FOLDER_PATH: include
  MirriHost:
    type: application
    platform: macOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        NSBonjourServices: ["_mirri._tcp"]
    dependencies:
      - target: MirriHostCore
      - target: VirtualDisplayShim
      - package: webrtc-xcframework
        product: LiveKitWebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mirri.host
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: Mirri displays this Mac's extended desktop on your tablet.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Mirri connects to the selected tablet over the explicitly chosen local IPv4 address to stream and to find paired tablets.
        INFOPLIST_KEY_LSUIElement: YES
  MirriHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: MirriHostCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
schemes:
  MirriHost:
    build:
      targets:
        MirriHost: all
        MirriHostTests: [test]
    test:
      targets:
        - MirriHostTests
